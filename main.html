<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Работа в TravelLine Tech</title>
    <link rel="icon" type="image/svg+xml" href="images/tl-logo.svg">
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <!-- Прозрачная фиксированная шапка -->
    <header class="header">
        <div class="header__container">
            <a href="#" class="header__logo">
                <img src="images/tl-logo.svg" alt="TravelLine" class="header__logo-icon">
                <span class="header__logo-text">TRAVELLINE</span>
            </a>

            <nav class="header__nav">
                <ul class="header__menu">
                    <li class="header__menu-item">
                        <a href="#" class="header__link">О Компании</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="#" class="header__link">Наши инструменты</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="#" class="header__link">Команда</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="#" class="header__link">Направление</a>
                    </li>
                </ul>
                <a href="#" class="header__vacancy-btn">Вакансии</a>
            </nav>
        </div>
    </header>

    <!-- Hero-блок (~80vh) -->
    <section class="hero">
        <div class="hero__content">
            <h2 class="hero__title">
                Стабильно растем<br>
                и принимаем новые вызовы<br>
                TravelTech индустрии
            </h2>
        </div>
    </section>

    <!-- Вертикальная карусель -->
    <section class="vertical-carousel" id="carousel">
        <div class="carousel__track">
            <div class="carousel__left">
                <ul class="carousel__list" id="left-list"></ul>
            </div>
            <div class="carousel__right">
                <ul class="carousel__list" id="right-list"></ul>
            </div>
        </div>
    </section>

    <script src="js/js.js"></script>
</body>

</html>
